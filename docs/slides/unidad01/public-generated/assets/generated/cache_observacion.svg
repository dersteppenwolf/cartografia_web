<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Observación de una caché HTTP</title>
  <desc id="desc">Un navegador consulta primero su caché y luego el servidor si no existe una respuesta reutilizable o requiere validación.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="72" y="66" width="1056" height="1" fill="#161a42"/>
  <text x="72" y="126" fill="#161a42" font-family="Arial, sans-serif" font-size="42" font-weight="600">Caché: observa si una respuesta se reutiliza</text>
  <rect x="90" y="258" width="238" height="156" fill="#eef2ff" stroke="#3f51e8" stroke-width="3"/>
  <text x="120" y="318" fill="#161a42" font-family="Arial, sans-serif" font-size="28" font-weight="600">Navegador</text>
  <rect x="466" y="258" width="238" height="156" fill="#dce4ff" stroke="#3f51e8" stroke-width="3"/>
  <text x="526" y="318" fill="#161a42" font-family="Arial, sans-serif" font-size="28" font-weight="600">Caché</text>
  <text x="500" y="354" fill="#373e70" font-family="Arial, sans-serif" font-size="19">respuesta almacenada</text>
  <rect x="844" y="258" width="268" height="156" fill="#161a42"/>
  <text x="876" y="318" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="600">Servidor</text>
  <text x="876" y="354" fill="#dce4ff" font-family="Arial, sans-serif" font-size="19">respuesta actual</text>
  <line x1="328" y1="314" x2="466" y2="314" stroke="#3f51e8" stroke-width="6"/>
  <polygon points="466,314 440,298 440,330" fill="#3f51e8"/>
  <line x1="704" y1="314" x2="844" y2="314" stroke="#161a42" stroke-width="6"/>
  <polygon points="844,314 818,298 818,330" fill="#161a42"/>
  <text x="348" y="278" fill="#3f51e8" font-family="Arial, sans-serif" font-size="19">¿reutilizable?</text>
  <text x="728" y="278" fill="#161a42" font-family="Arial, sans-serif" font-size="19">si falta o vence</text>
  <rect x="90" y="486" width="1022" height="78" fill="#eef2ff"/>
  <text x="122" y="520" fill="#161a42" font-family="Arial, sans-serif" font-size="20">En DevTools, registra si la respuesta vino de caché.</text>
  <text x="122" y="550" fill="#161a42" font-family="Arial, sans-serif" font-size="20">Una respuesta rápida no prueba que viajó por la red.</text>
  <text x="72" y="630" fill="#626a93" font-family="Arial, sans-serif" font-size="18">Diagrama propio basado en el modelo de caché HTTP.</text>
</svg>
