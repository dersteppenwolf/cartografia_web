<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Flujo cliente servidor de un mapa web</title>
  <desc id="desc">Un navegador solicita HTML, CSS y JavaScript a un servidor estático. Después solicita GeoJSON y representa mapa, leyenda, estado y tabla.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="72" y="66" width="1056" height="1" fill="#161a42"/>
  <text x="72" y="126" fill="#161a42" font-family="Arial, sans-serif" font-size="42" font-weight="600">Del navegador al mapa</text>
  <rect x="84" y="244" width="252" height="176" fill="#eef2ff" stroke="#3f51e8" stroke-width="3"/>
  <text x="112" y="302" fill="#161a42" font-family="Arial, sans-serif" font-size="28" font-weight="600">Navegador</text>
  <text x="112" y="344" fill="#373e70" font-family="Arial, sans-serif" font-size="21">HTML, CSS, JavaScript</text>
  <text x="112" y="378" fill="#373e70" font-family="Arial, sans-serif" font-size="21">Mapa, leyenda y tabla</text>
  <rect x="864" y="244" width="252" height="176" fill="#161a42"/>
  <text x="892" y="302" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="600">Servidor estático</text>
  <text x="892" y="344" fill="#ffffff" font-family="Arial, sans-serif" font-size="21">Entrega archivos</text>
  <text x="892" y="378" fill="#ffffff" font-family="Arial, sans-serif" font-size="21">y GeoJSON</text>
  <line x1="354" y1="296" x2="838" y2="296" stroke="#3f51e8" stroke-width="6"/>
  <polygon points="838,296 812,280 812,312" fill="#3f51e8"/>
  <text x="472" y="272" fill="#3f51e8" font-family="Arial, sans-serif" font-size="22">GET /mapa/</text>
  <line x1="838" y1="368" x2="354" y2="368" stroke="#161a42" stroke-width="6"/>
  <polygon points="354,368 380,352 380,384" fill="#161a42"/>
  <text x="454" y="402" fill="#161a42" font-family="Arial, sans-serif" font-size="22">200 HTML, CSS, JavaScript y GeoJSON</text>
  <rect x="402" y="496" width="396" height="82" fill="#dce4ff"/>
  <text x="434" y="547" fill="#161a42" font-family="Arial, sans-serif" font-size="24" font-weight="600">La interfaz verifica la respuesta antes de usar los datos.</text>
  <text x="72" y="632" fill="#626a93" font-family="Arial, sans-serif" font-size="18">Diagrama propio para el ejemplo local del curso.</text>
</svg>
