<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación de privacidad de una ubicación</title>
  <desc id="desc">Un diagrama muestra una coordenada precisa que pasa por una revisión de sensibilidad, licencia y minimización antes de llegar a una publicación cartográfica.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="72" y="66" width="1056" height="1" fill="#161a42"/>
  <text x="72" y="126" fill="#161a42" font-family="Arial, sans-serif" font-size="42" font-weight="600">Antes de publicar, evalúa el riesgo de la ubicación</text>
  <rect x="72" y="246" width="260" height="172" fill="#eef2ff" stroke="#3f51e8" stroke-width="3"/>
  <text x="104" y="306" fill="#161a42" font-family="Arial, sans-serif" font-size="25" font-weight="600">Dato preciso</text>
  <text x="104" y="346" fill="#373e70" font-family="monospace" font-size="20">-74.0700, 4.7150</text>
  <text x="104" y="378" fill="#373e70" font-family="Arial, sans-serif" font-size="18">coordenada y atributos</text>
  <line x1="332" y1="332" x2="468" y2="332" stroke="#e06960" stroke-width="6"/>
  <polygon points="468,332 442,316 442,348" fill="#e06960"/>
  <rect x="500" y="206" width="312" height="252" fill="#161a42"/>
  <text x="532" y="264" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="600">Revisión</text>
  <text x="532" y="310" fill="#dce4ff" font-family="Arial, sans-serif" font-size="19">¿Identifica personas?</text>
  <text x="532" y="344" fill="#dce4ff" font-family="Arial, sans-serif" font-size="19">¿Expone especies o</text>
  <text x="532" y="372" fill="#dce4ff" font-family="Arial, sans-serif" font-size="19">infraestructura sensible?</text>
  <text x="532" y="418" fill="#ffc21a" font-family="Arial, sans-serif" font-size="19">licencia · fecha · propósito</text>
  <line x1="812" y1="332" x2="930" y2="332" stroke="#3f51e8" stroke-width="6"/>
  <polygon points="930,332 904,316 904,348" fill="#3f51e8"/>
  <rect x="962" y="246" width="166" height="172" fill="#dce4ff" stroke="#3f51e8" stroke-width="3"/>
  <text x="990" y="306" fill="#161a42" font-family="Arial, sans-serif" font-size="25" font-weight="600">Publicar</text>
  <text x="990" y="346" fill="#373e70" font-family="Arial, sans-serif" font-size="18">minimizar,</text>
  <text x="990" y="374" fill="#373e70" font-family="Arial, sans-serif" font-size="18">agregar o excluir</text>
  <text x="72" y="630" fill="#626a93" font-family="Arial, sans-serif" font-size="18">Diagrama propio: no toda coordenada precisa debe publicarse como dato abierto.</text>
</svg>
