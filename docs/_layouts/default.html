<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/tokens.css' | relative_url }}"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido principal</a>
    <header class="site-header">
      <div class="site-shell">
        <p class="site-kicker">Curso abierto · cartografía web</p>
        <p class="site-title">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </p>
        <p class="site-description">{{ site.description }}</p>
        <nav class="site-nav" aria-label="Navegación principal">
          <a href="{{ '/' | relative_url }}">Inicio</a>
          <a href="{{ '/programa/' | relative_url }}">Programa</a>
          <a href="{{ '/#material-curricular-aprobado' | relative_url }}"
            >Unidades</a
          >
          <a href="{{ '/examples/leaflet/mapa_basico/' | relative_url }}"
            >Ejemplos</a
          >
        </nav>
      </div>
    </header>
    <main id="contenido" class="site-main site-shell">{{ content }}</main>
    <footer class="site-footer">
      <div class="site-shell">
        <p>
          Material en modernizacion. Consulte el estado y las condiciones de uso
          antes de reutilizar recursos historicos.
        </p>
      </div>
    </footer>
  </body>
</html>
