third_party:
  - name: Planetiler
    version: 0.10.3-SNAPSHOT
    source: ghcr.io/onthegomap/planetiler
    license: Apache-2.0
    kind: containerized vector tile generator
    use: Static PMTiles generation from approved vector fixtures
  - name: PMTiles CLI
    version: pinned container digest
    source: docker.io/protomaps/go-pmtiles
    license: BSD-3-Clause
    kind: PMTiles verifier and converter
    use: Validate static PMTiles output from the maintained Hito 7 generator
  - name: GeoServer
    version: 3.0.0
    source: docker.osgeo.org/geoserver
    license: GPL-2.0-or-later
    kind: container image
    use: Isolated Hito 5A interoperability prototype
  - name: GeoServer OGC API - Features plugin
    version: 3.0.0
    source: sourceforge.net GeoServer extension archive
    license: GPL-2.0-or-later
    kind: GeoServer extension ZIP
    use: Required module for Hito 5A OGC API - Features prototype
  - name: GeoServer Vector Tiles plugin
    version: 3.0.0
    source: netix.dl.sourceforge.net GeoServer extension archive
    license: GPL-2.0-or-later
    kind: GeoServer extension ZIP
    use: Pinned MVT support for the reproducible GeoServer stack
  - name: PostgreSQL/PostGIS
    version: 17-3.5
    source: docker.io/postgis/postgis
    license: PostgreSQL and GPL-2.0-or-later components
    kind: container image
    use: Isolated Hito 5A spatial database prototype
  - name: GDAL
    version: ubuntu-small-3.10.3
    source: ghcr.io/osgeo/gdal
    license: MIT
    kind: containerized geospatial data tool
    use: Deterministic GeoJSON to GeoPackage conversion and COG generation
  - name: Leaflet
    version: 1.9.4
    source:
      package.json, package-lock.json, and examples/leaflet/mapa_basico/vendor
    license: BSD-2-Clause
    kind: JavaScript mapping library
    use: Token-free introductory map example
  - name: OpenStreetMap Standard raster tiles
    version: service policy reviewed 2026-08-03
    source: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    license: ODbL-1.0 data; CC-BY-SA-2.0 cartography
    kind: public raster basemap service
    use:
      Optional visual context for the maintained Leaflet example; attribution is
      visible and no tiles are prefetched
  - name: MapLibre GL JS
    version: 6.1.0
    source: package.json and package-lock.json
    license: BSD-3-Clause
    kind: JavaScript mapping library
    use: Maintained TypeScript map client
  - name: PMTiles JavaScript
    version: 4.4.1
    source: package.json and package-lock.json
    license: BSD-3-Clause
    kind: JavaScript PMTiles protocol
    use: Client-side PMTiles access
  - name: MapLibre COG Protocol
    version: 0.9.1
    source: package.json, package-lock.json, and examples/maplibre/app/public
    license: MIT
    kind: JavaScript COG protocol
    use:
      Client-side COG access; the published UMD bundle is generated by
      prepare_cog_protocol.py
  - name: Jekyll and jekyll-theme-hacker
    version: Jekyll 4.3.4 and jekyll-theme-hacker 0.2.0
    source: Gemfile and Gemfile.lock
    license: MIT
    kind: Ruby gem
    use: Temporary root publication barrier and maintained documentation build
  - name: Historic npm tooling
    version: 'husky 3.1.0, lint-staged 9.5.0, prettier 1.19.1'
    source: package.json
    license: pending
    kind: npm
    use: historical tooling to replace in Hito 1
  - name: QGIS2Web generated dependencies
    version: pending inventory by generated tree
    source:
      02_Conceptos/ejemplo_qgis2web and 02_Conceptos/qgis2web_world_borders
    license: pending
    kind: vendored JavaScript, CSS, fonts, and images
    use: archive only after license review
  - name: Course PDFs and images
    version: historical
    source: 01_Fundamentos through 08_Arquitectura_SIG
    license: pending
    kind: educational content and screenshots
    use: exclude from public build until reviewed
