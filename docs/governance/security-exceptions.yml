exceptions:
  - id: geoserver-runtime-root-handoff
    scope: infra/geoserver/Dockerfile and infra/prototypes/geoserver/Dockerfile
    severity: high
    owner: infrastructure-security
    approver: instructor
    justification:
      GeoServer 3.0.0 startup installs extensions and credentials as root, then
      RUN_UNPRIVILEGED=true starts Tomcat as UID/GID 999. Forcing a final
      Dockerfile USER prevents startup and fails the stack smoke test.
    expires_at: '2026-12-31'
