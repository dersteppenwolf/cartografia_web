services:
  postgis:
    image: postgis/postgis@sha256:45f2a608397fa67d236b012c14a9e3ea31e9fe813edbeb5c1c0d1acbf0d48ea9
    environment:
      POSTGRES_DB: curso
      POSTGRES_USER: curso_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgis_password
    secrets:
      - postgis_password
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgis/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curso_admin -d curso"]
      interval: 5s
      timeout: 3s
      retries: 20

  geoserver:
    build:
      context: ./geoserver
    image: cartografia-web/geoserver-ogcapi-features:3.0.0
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      INSTALL_EXTENSIONS: "false"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:4173"
      CORS_ALLOWED_METHODS: "GET,HEAD,OPTIONS"
      GEOSERVER_ADMIN_USER_FILE: /run/secrets/geoserver_user
      GEOSERVER_ADMIN_PASSWORD_FILE: /run/secrets/geoserver_password
    secrets:
      - geoserver_user
      - geoserver_password
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/geoserver_data/global.xml"]
      interval: 5s
      timeout: 3s
      retries: 30

  static:
    image: nginx@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./static/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../data/fixtures/cloud:/usr/share/nginx/html/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/assets/referencia.cog.tif"]
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  postgis_password:
    file: ./secrets/postgis_password.example
  geoserver_user:
    file: ./secrets/geoserver_user.example
  geoserver_password:
    file: ./secrets/geoserver_password.example

volumes:
  postgis_data:
