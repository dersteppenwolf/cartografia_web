services:
  postgis:
    image: postgis/postgis@sha256:45f2a608397fa67d236b012c14a9e3ea31e9fe813edbeb5c1c0d1acbf0d48ea9
    environment:
      POSTGRES_DB: curso
      POSTGRES_USER: curso_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgis_password
    secrets:
      - postgis_password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curso_admin -d curso"]
      interval: 5s
      timeout: 3s
      retries: 20

  geoserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: cartografia-web/geoserver-ogcapi-features:3.0.0-prototype
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      INSTALL_EXTENSIONS: "false"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:4173"
      CORS_ALLOWED_METHODS: "GET,HEAD,OPTIONS"
      GEOSERVER_ADMIN_USER_FILE: /run/secrets/geoserver_user
      GEOSERVER_ADMIN_PASSWORD_FILE: /run/secrets/geoserver_password
    secrets:
      - geoserver_user
      - geoserver_password
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/geoserver_data/global.xml"]
      interval: 5s
      timeout: 3s
      retries: 30

secrets:
  postgis_password:
    file: ./secrets/postgis_password.txt
  geoserver_user:
    file: ./secrets/geoserver_user.txt
  geoserver_password:
    file: ./secrets/geoserver_password.txt
